# Builds the Python package (swarmgrid-mapf) for Linux, macOS and Windows and, for a version tag
# (v0.2.0, ...), publishes it to PyPI. Runs only by hand (Actions tab -> Wheels -> Run workflow) or
# on such a tag, so normal pushes are unaffected.
#
# Publishing uses PyPI trusted publishing (no token in the repo). One-time setup on pypi.org:
# Account -> Publishing -> add a pending publisher: project swarmgrid-mapf, owner tabish2786,
# repository SwarmGrid, workflow wheels.yml, environment pypi.
name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
          CIBW_TEST_COMMAND: "python -m unittest discover -s {project}/tests/python"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
